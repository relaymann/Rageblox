name: Build Godot
description: Build Godot with the provided options.
defaults:
  run:
    working-directory: ./godot-engine
inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: "editor"
  tests:
    description: Unit tests.
    default: false
  platform:
    description: Target platform.
    required: false
  sconsflags:
    default: ""
  scons-cache:
    description: The scons cache path.
    default: "${{ github.workspace }}/.scons-cache/"
  scons-cache-limit:
    description: The scons cache size limit.
    default: 7168
runs:
  using: "composite"
  steps:
    - name: Scons Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SCONSFLAGS: ${{ inputs.sconsflags }}
      run: |
        Set-Location godot-engine
        if ("${{ inputs.target }}" -ne "editor") { Remove-Item -Recurse -Force editor -ErrorAction SilentlyContinue }
        $env:BUILD_NAME = "gh"

        # GitHub's Windows images put MinGW/Git ahead of MSVC on PATH. Godot's
        # SCons detection can therefore report MSVC from VCVARS while still
        # emitting g++/windres commands. Force the complete native MSVC toolchain
        # explicitly so Windows SDK paths, architecture defines, resources, and
        # linking all use the same compiler family.
        $env:CC = "cl.exe"
        $env:CXX = "cl.exe"
        $env:AR = "lib.exe"
        $env:LINK = "link.exe"
        $env:RC = "rc.exe"

        $sconsFlags = @($env:SCONSFLAGS -split '\s+' | Where-Object { $_ -ne '' })
        scons platform=${{ inputs.platform }} target=${{ inputs.target }} tests=${{ inputs.tests }} use_mingw=no CC=cl.exe CXX=cl.exe AR=lib.exe LINK=link.exe RC=rc.exe @sconsFlags
        Get-ChildItem bin/

    - name: Scons Build (Unix)
      if: runner.os != 'Windows'
      shell: sh
      env:
        SCONSFLAGS: ${{ inputs.sconsflags }}
      run: |
        cd godot-engine
        if [ "${{ inputs.target }}" != "editor" ]; then rm -rf editor; fi
        export BUILD_NAME="gh"
        scons platform=${{ inputs.platform }} target=${{ inputs.target }} tests=${{ inputs.tests }} ${{ inputs.sconsflags }}
        ls -l bin/
