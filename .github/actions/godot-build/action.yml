name: Build Godot
description: Build Godot with the provided options.
defaults:
  run:
    working-directory: ./godot-engine
inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: "editor"
  tests:
    description: Unit tests.
    default: false
  platform:
    description: Target platform.
    required: false
  sconsflags:
    default: ""
  scons-cache:
    description: The scons cache path.
    default: "${{ github.workspace }}/.scons_cache/"
  scons-cache-limit:
    description: The scons cache size limit.
    default: 7168
runs:
  using: "composite"
  steps:
    - name: Scons Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ("${{ inputs.target }}" -ne "editor") { Remove-Item -Recurse -Force editor -ErrorAction SilentlyContinue }
        $env:BUILD_NAME = "gh"

        # Hosted Windows runners ship MinGW/Git/LLVM alongside MSVC. Godot's
        # Windows detector must see a clean native MSVC environment; otherwise
        # it can select MinGW tools while still receiving MSVC include/flag data.
        foreach ($name in @("MINGW_PREFIX", "MSYSTEM", "MSYS", "MSYS2_ARG_CONV_EXCL")) {
          Remove-Item "Env:$name" -ErrorAction SilentlyContinue
        }

        $sconsFlags = @("${{ inputs.sconsflags }}" -split '\s+' | Where-Object { $_ -ne '' })
        & scons platform=${{ inputs.platform }} target=${{ inputs.target }} tests=${{ inputs.tests }} use_mingw=no use_llvm=no msvc_version=14.5 @sconsFlags cache_path="${{ github.workspace }}/.scons_cache"
        if ($LASTEXITCODE -ne 0) {
          $exitCode = $LASTEXITCODE
          Write-Error "SCons failed with exit code $exitCode."
          exit $exitCode
        }
        if (-not (Test-Path -LiteralPath "bin" -PathType Container)) {
          Write-Error "SCons did not create bin."
          exit 1
        }
        Get-ChildItem bin/
    - name: Scons Build (Unix)
      if: runner.os != 'Windows'
      shell: sh
      env:
        SCONSFLAGS: ${{ inputs.sconsflags }}
      run: |
        cd godot-engine
        if [ "${{ inputs.target }}" != "editor" ]; then rm -rf editor; fi
        export BUILD_NAME="gh"
        scons platform=${{ inputs.platform }} target=${{ inputs.target }} tests=${{ inputs.tests }} ${{ inputs.sconsflags }} cache_path="${GITHUB_WORKSPACE}/.scons_cache"
        ls -l bin/
