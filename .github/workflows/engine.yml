name: Engine
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      self-hosted-runner:
        required: true
        type: boolean
      windows-only:
        required: false
        type: boolean
        default: false
      deploy-to-gcp:
        required: false
        type: boolean
        default: true
    secrets:
      GCP_BUCKET_UPLOAD:
        required: false
    outputs:
      commit_hash:
        value: ${{ jobs.build-windows.outputs.commit_hash }}

defaults:
  run:
    working-directory: ./godot-engine

# Global Settings
env:
  # Used for the cache key. Add version suffix to force clean build.
  GODOT_BASE_BRANCH: master
  SCONSFLAGS: verbose=yes warnings=extra werror=no module_text_server_fb_enabled=yes fontconfig=no
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TSAN_OPTIONS: suppressions=misc/error_suppressions/tsan.txt

concurrency:
  # workflow name - PR || fallback to unique run id, this happens when you're not building a PR
  # this ensures all branches build properly and cancel their previous runs
  group: engine-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: ${{ inputs.self-hosted-runner && 'windows-mirror' || 'windows-latest' }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows Editor
            cache-name: windows-editor
            target: editor
            strip: true
            tests: false
            sconsflags: arch=x86_64 debug_symbols=no windows_subsystem=console optimize=speed production=yes
            bin: "./bin/godot.windows.editor.x86_64"
            artifact-name: "MirrorGodotEditorWindows"
            artifact: true
            bucket-name: mirror_native_client_builds/Engine

          - name: Windows Template
            cache-name: windows-template
            target: template_release
            strip: true
            tests: false
            sconsflags: arch=x86_64 debug_symbols=no optimize=speed
            bin: "./bin/godot.windows.template_release.x86_64"
            artifact-name: "windows_release_x86_64"
            artifact: true
            bucket-name: mirror_native_client_builds/Engine
    outputs:
      commit_hash: ${{ steps.vars.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get RageBlox commit hash
        id: vars
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 8)
          Write-Host "RageBlox hash: $sha"
          "sha_short=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify RageBlox commit hash
        if: steps.vars.outputs.sha_short == ''
        shell: pwsh
        run: |
          Write-Error "RageBlox commit hash was not generated."
          exit 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: godot-engine/SConstruct

      - name: Setup SCons
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons==4.10.1 pywin32

      - name: Setup Visual C++
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      #- name: Download Direct3D 12 SDK components
      #  run: python ./misc/scripts/install_d3d12_sdk_windows.py

      - name: Restore Godot SCons cache
        uses: actions/cache@v4
        with:
          path: .scons_cache
          key: windows-scons-${{ matrix.cache-name }}-${{ hashFiles('godot-engine/SConstruct') }}
          restore-keys: |
            windows-scons-${{ matrix.cache-name }}-

      - name: Setup MSVC problem matcher
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Compilation
        shell: pwsh
        env:
          SCONSFLAGS: ""
        run: |
          Set-Location "$env:GITHUB_WORKSPACE\godot-engine"
          if ("${{ matrix.target }}" -ne "editor") {
            Remove-Item -Recurse -Force editor -ErrorAction SilentlyContinue
          }
          $env:BUILD_NAME = "gh"

          # Hosted Windows runners expose MinGW/Git/LLVM alongside MSVC.
          # Force Godot/SCons to use the configured native MSVC toolchain.
          foreach ($name in @("MINGW_PREFIX", "MSYSTEM", "MSYS", "MSYS2_ARG_CONV_EXCL")) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }

          # SCons on Windows must receive one argument per option. Do not pass
          # the combined SCONSFLAGS string through the environment.
          $sconsFlagsText = "${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }}"
          $sconsFlags = @($sconsFlagsText -split '\s+' | Where-Object { $_ -ne '' })

          & scons platform=windows target=${{ matrix.target }} tests=${{ matrix.tests }} use_mingw=no use_llvm=no msvc_version=14.5 @sconsFlags cache_path="$env:GITHUB_WORKSPACE\.scons_cache"
          if ($LASTEXITCODE -ne 0) {
            $exitCode = $LASTEXITCODE
            Write-Error "SCons failed with exit code $exitCode."
            exit $exitCode
          }
          if (-not (Test-Path -LiteralPath "bin" -PathType Container)) {
            Write-Error "SCons did not create godot-engine/bin."
            exit 1
          }
          Get-ChildItem bin/
      - name: Strip binaries
        if: ${{ matrix.strip }}
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Move PDB file (if not stripped)
        if: ${{ !matrix.strip }}
        run: |
          dir -Path ./bin/
          mv ${{matrix.bin}}.pdb bin/${{ matrix.artifact-name}}.pdb

      - name: Prepare artifact
        if: ${{ matrix.artifact }}
        run: |
          mv ${{ matrix.bin }}.exe bin/${{ matrix.artifact-name }}.exe

      - name: Verify Windows artifact
        if: ${{ matrix.artifact }}
        shell: pwsh
        run: |
          $artifact = Join-Path $env:GITHUB_WORKSPACE "godot-engine/bin/${{ matrix.artifact-name }}.exe"
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            Write-Error "Expected Windows artifact was not produced: $artifact"
            Get-ChildItem "$env:GITHUB_WORKSPACE/godot-engine/bin" -Force | Format-Table Name,Length
            exit 1
          }
          $size = (Get-Item -LiteralPath $artifact).Length
          if ($size -lt 1048576) {
            Write-Error "Windows artifact is unexpectedly small ($size bytes): $artifact"
            exit 1
          }
          Write-Host "Verified Windows artifact: $artifact ($size bytes)"

      - name: Upload artifact
        if: ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          path: ./godot-engine/bin/${{ matrix.artifact-name }}.exe
          name: ${{ matrix.artifact-name }}.exe
          retention-days: 14
          if-no-files-found: error

      # GitHub artifacts are the primary developer download. GCP publishing is optional.
      - uses: 'google-github-actions/auth@v2'
        if: ${{ inputs.deploy-to-gcp }}
        continue-on-error: true
        with:
          credentials_json: '${{ secrets.GCP_BUCKET_UPLOAD }}'

      - name: Upload binary
        if: ${{ inputs.deploy-to-gcp }}
        continue-on-error: true
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: ./godot-engine/bin/${{ matrix.artifact-name }}.exe
          destination: ${{ matrix.bucket-name }}/${{steps.vars.outputs.sha_short}}/
  build-windows-showcase:
    needs: build-windows
    runs-on: ${{ inputs.self-hosted-runner && 'windows-mirror' || 'windows-latest' }}
    name: Windows Showcase
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download Windows Editor
        uses: actions/download-artifact@v4
        with:
          name: MirrorGodotEditorWindows.exe
          path: .ci/showcase/editor
      - name: Download Windows Template
        uses: actions/download-artifact@v4
        with:
          name: windows_release_x86_64.exe
          path: .ci/showcase/template
      - name: Configure isolated Showcase project
        shell: pwsh
        run: |
          $editor = Join-Path $env:GITHUB_WORKSPACE ".ci/showcase/editor/MirrorGodotEditorWindows.exe"
          $template = Join-Path $env:GITHUB_WORKSPACE ".ci/showcase/template/windows_release_x86_64.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "mirror-godot-app/showcase-standalone"
          $projectPath = Join-Path $project "project.godot"
          $presetPath = Join-Path $project "export_presets.cfg"
          if (-not (Test-Path -LiteralPath $editor -PathType Leaf)) { throw "Windows editor artifact is missing: $editor" }
          if (-not (Test-Path -LiteralPath $template -PathType Leaf)) { throw "Windows template artifact is missing: $template" }
          if (-not (Test-Path -LiteralPath $projectPath -PathType Leaf)) { throw "Isolated Showcase project.godot is missing." }
          foreach ($file in @("showcase_place.tscn", "showcase_place.gd", "rageblox_showcase.tscn", "rageblox_showcase.gd", "showcase_interactable.gd", "rageblox_icon.png", "export_presets.cfg")) {
            if (-not (Test-Path -LiteralPath (Join-Path $project $file) -PathType Leaf)) { throw "Required standalone Showcase file is missing: $file" }
          }
          $settings = Get-Content -LiteralPath $projectPath -Raw
          if ($settings -notmatch 'run/main_scene="res://showcase_place.tscn"') { throw "Standalone Showcase main scene is not configured." }
          if ($settings -match '(?m)^\[autoload\]') { throw "Standalone Showcase must not depend on autoloads." }
          if ($settings -match 'boot_scene.tscn|rageblox_platform|compressed_build_exporter') { throw "Standalone Showcase references the platform startup stack." }
          $preset = Get-Content -LiteralPath $presetPath -Raw
          if (-not $preset.Contains('[preset.0.options]')) { throw "Standalone Windows export preset is missing." }
          $templateConfigPath = $template.Replace("\", "/")
          # The custom engine checks both template slots during export preflight, even for release-only exports.
          foreach ($kind in @("debug", "release")) {
            $emptyOption = 'custom_template/' + $kind + '=""'
            $customOption = 'custom_template/' + $kind + '="' + $templateConfigPath + '"'
            if (-not $preset.Contains($emptyOption)) { throw "Could not locate empty custom $kind template option in Showcase export preset." }
            $preset = $preset.Replace($emptyOption, $customOption)
          }
          foreach ($kind in @("debug", "release")) {
            $customOption = 'custom_template/' + $kind + '="' + $templateConfigPath + '"'
            if (-not $preset.Contains($customOption)) { throw "Custom Windows $kind template path was not applied." }
          }
          if (-not $preset.Contains('binary_format/embed_pck=true')) { throw "Standalone Showcase must embed its game data." }
          if (-not $preset.Contains('texture_format/s3tc_bptc=true') -and -not $preset.Contains('texture_format/etc2_astc=true')) {
            throw "Standalone Showcase must enable at least one texture format."
          }
          Set-Content -LiteralPath $presetPath -Value $preset -NoNewline
          $writtenPreset = Get-Content -LiteralPath $presetPath -Raw
          foreach ($kind in @("debug", "release")) {
            $customOption = 'custom_template/' + $kind + '="' + $templateConfigPath + '"'
            if (-not $writtenPreset.Contains($customOption)) { throw "Configured custom Windows $kind template path was not written to disk." }
          }
          Write-Host "Validated isolated Showcase project, texture format, and both custom template paths."
      - name: Validate standalone Showcase scripts before export
        shell: pwsh
        run: |
          $editor = Join-Path $env:GITHUB_WORKSPACE ".ci/showcase/editor/MirrorGodotEditorWindows.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "mirror-godot-app/showcase-standalone"
          $log = Join-Path $env:GITHUB_WORKSPACE ".ci/showcase/showcase-import.log"
          if (Test-Path -LiteralPath $log) { Remove-Item -LiteralPath $log -Force }
          & $editor --headless --path $project --import --log-file $log
          $exitCode = $LASTEXITCODE
          if (Test-Path -LiteralPath $log) {
            $logText = Get-Content -LiteralPath $log -Raw
            if ($logText -match '(?im)(SCRIPT ERROR|USER SCRIPT ERROR|Parse Error|Failed to load resource|Failed to load script)') {
              Write-Host $logText
              throw "Standalone Showcase script/import preflight found a parse or resource error."
            }
          }
          if ($exitCode -ne 0) { throw "Standalone Showcase import preflight failed with exit code $exitCode." }
          Write-Host "Standalone Showcase import and script preflight passed."
      - name: Export RageBlox Showcase
        shell: pwsh
        run: |
          $editor = Join-Path $env:GITHUB_WORKSPACE ".ci/showcase/editor/MirrorGodotEditorWindows.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "mirror-godot-app/showcase-standalone"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "showcase-build"
          $output = Join-Path $outputDir "RageBlox-Showcase-Windows.exe"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $editor --headless --path $project --export-release "Windows" $output
          if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE; Write-Error "RageBlox Showcase export failed with exit code $exitCode."; exit $exitCode }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "RageBlox Showcase executable was not produced." }
          $size = (Get-Item -LiteralPath $output).Length
          if ($size -lt 1048576) { throw "RageBlox Showcase executable is unexpectedly small ($size bytes)." }
          Write-Host "Verified isolated embedded Showcase build: $output ($size bytes)"
      - name: Smoke-test exported Showcase startup
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "showcase-build/RageBlox-Showcase-Windows.exe"
          $log = Join-Path $env:GITHUB_WORKSPACE "showcase-build/showcase-smoke.log"
          if (Test-Path -LiteralPath $log) { Remove-Item -LiteralPath $log -Force }
          # Run the actual exported executable. This catches scene/script parse failures
          # that the exporter's successful exit code cannot detect.
          $process = Start-Process -FilePath $output -ArgumentList @("--headless", "--quit-after", "300", "--log-file", $log) -PassThru
          if (-not $process.WaitForExit(30000)) {
            try { $process.Kill() } catch {}
            throw "Showcase startup smoke test timed out after 30 seconds."
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log }
            throw "Showcase startup smoke test exited with code $($process.ExitCode)."
          }
          if (Test-Path -LiteralPath $log) {
            $logText = Get-Content -LiteralPath $log -Raw
            if ($logText -match '(?im)(SCRIPT ERROR|USER SCRIPT ERROR|Parse Error|Failed to load resource|Failed to load script|Cannot get class|Non-existing or invalid boot splash|ERROR:.*(Showcase|showcase))') {
              Write-Host $logText
              throw "Showcase startup smoke test found a startup error."
            }
            Write-Host "Showcase startup smoke test passed."
          } else {
            Write-Host "Showcase startup smoke test passed without a log file."
          }
      - name: Upload RageBlox Showcase
        uses: actions/upload-artifact@v4
        with:
          name: RageBlox-Showcase-Windows.exe
          path: ./showcase-build/RageBlox-Showcase-Windows.exe
          retention-days: 14
          if-no-files-found: error

  build-windows-studio:
    needs: build-windows
    runs-on: windows-latest
    name: Windows RageBlox Studio
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download Windows Editor
        uses: actions/download-artifact@v4
        with:
          name: MirrorGodotEditorWindows.exe
          path: .ci/studio/editor
      - name: Download Windows Template
        uses: actions/download-artifact@v4
        with:
          name: windows_release_x86_64.exe
          path: .ci/studio/template
      - name: Configure Studio launcher project
        shell: pwsh
        run: |
          $project = Join-Path $env:GITHUB_WORKSPACE "mirror-godot-app/project.godot"
          $presetPath = Join-Path $env:GITHUB_WORKSPACE "mirror-godot-app/export_presets.cfg"
          $editor = Join-Path $env:GITHUB_WORKSPACE ".ci/studio/editor/MirrorGodotEditorWindows.exe"
          $template = Join-Path $env:GITHUB_WORKSPACE ".ci/studio/template/windows_release_x86_64.exe"
          if (-not (Test-Path -LiteralPath $editor -PathType Leaf)) { throw "Windows Editor artifact is missing." }
          if (-not (Test-Path -LiteralPath $template -PathType Leaf)) { throw "Windows Template artifact is missing." }
          Add-Content -LiteralPath $project -Value ([Environment]::NewLine + "[rageblox_studio]" + [Environment]::NewLine + "studio_launcher=true" + [Environment]::NewLine)
          $preset = Get-Content -LiteralPath $presetPath -Raw
          $start = $preset.IndexOf("[preset.0.options]")
          $end = $preset.IndexOf("[preset.1]", $start)
          if ($start -lt 0 -or $end -lt 0) { throw "Windows export preset could not be located." }
          $section = $preset.Substring($start, $end - $start)
          $templatePath = $template -replace '\\', '/'
          $section = $section.Replace('custom_template/release=""', ('custom_template/release="' + $templatePath + '"'))
          $section = $section.Replace("binary_format/embed_pck=false", "binary_format/embed_pck=true")
          $section = $section.Replace('application/product_name="The Mirror"', 'application/product_name="RageBlox Studio"')
          Set-Content -LiteralPath $presetPath -Value ($preset.Substring(0, $start) + $section + $preset.Substring($end)) -NoNewline
      - name: Export RageBlox Studio
        shell: pwsh
        run: |
          $editor = Join-Path $env:GITHUB_WORKSPACE ".ci/studio/editor/MirrorGodotEditorWindows.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "mirror-godot-app"
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "studio-build"
          $output = Join-Path $outputDir "RageBloxStudio.exe"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          & $editor --headless --path $project --export-release "Windows" $output
          if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE; Write-Error "RageBlox Studio export failed with exit code $exitCode."; exit $exitCode }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) { throw "RageBlox Studio executable was not produced." }
          $size = (Get-Item -LiteralPath $output).Length
          if ($size -lt 1048576) { throw "RageBlox Studio executable is unexpectedly small ($size bytes)." }
          Copy-Item -LiteralPath $editor -Destination (Join-Path $outputDir "MirrorGodotEditorWindows.exe") -Force
          Write-Host "Verified RageBlox Studio bundle ($size bytes)."
      - name: Upload RageBlox Studio bundle
        uses: actions/upload-artifact@v4
        with:
          name: RageBlox-Studio-Windows
          path: ./studio-build
          retention-days: 14
          if-no-files-found: error

  build-macos:
    if: ${{ !inputs.windows-only }}
    runs-on: ${{ inputs.self-hosted-runner && 'macos-mirror' || 'macos-latest' }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MacOS Editor
            cache-name: macos-editor
            target: editor
            tests: false
            strip: true
            sconsflags: debug_symbols=no optimize=speed production=yes use_static_cpp=yes
            dist-app: "macos_tools.app"
            packaged-app: "MirrorGodotEditorMac.app"
            bin-name: "godot.macos.editor.universal"
            bin-name-x86_64: "godot.macos.editor.x86_64"
            bin-name-arm64: "godot.macos.editor.arm64"
            artifact-bin-name: "Godot"
            artifact-name: "MirrorGodotEditorMac.app"
            bucket-name: mirror_native_client_builds/Engine

          - name: MacOS Template
            cache-name: macos-template
            target: template_release
            tests: false
            strip: true
            sconsflags: debug_symbols=no optimize=speed use_static_cpp=yes
            dist-app: "macos_template.app"
            packaged-app: "macos_template.app"
            bin-name: "godot.macos.template_release.universal"
            bin-name-x86_64: "godot.macos.template_release.x86_64"
            bin-name-arm64: "godot.macos.template_release.arm64"
            artifact-bin-name: "godot_macos_release.universal"
            artifact-name: "macos_template.app"
            bucket-name: mirror_native_client_builds/Engine

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get short commit hash
        id: vars
        run: |
          echo "Git hash: $(git rev-parse --short=8 HEAD)"
          echo "sha_short=$(git rev-parse --short=8 HEAD)" >> $GITHUB_OUTPUT

      - name: Ensuring git hash exists (or will fail job)
        if: steps.vars.outputs.sha_short == ''
        run: exit 1

      - name: Validate GCP credentials before build
        if: ${{ inputs.deploy-to-gcp }}
        shell: bash
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_BUCKET_UPLOAD }}
        run: |
          if [ -z "$GCP_CREDENTIALS_JSON" ]; then
            echo "GCP_BUCKET_UPLOAD is required when deploy-to-gcp is enabled." >&2
            exit 1
          fi

      - name: Setup python and scons
        uses: ./godot-engine/.github/actions/godot-deps

      - name: Setup Vulkan SDK
        run: |
          sh ./misc/scripts/install_vulkan_sdk_macos.sh

      - name: Restore Godot SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons_cache
          key: ${{ runner.os }}-scons-${{ matrix.cache-name }}-${{ hashFiles('godot-engine/SConstruct') }}
          restore-keys: |
            ${{ runner.os }}-scons-${{ matrix.cache-name }}-

      - name: Setup scons (python is already installed on self-hosted runners!)
        shell: bash
        run: |
          python3 -c "import sys; print(sys.version)"
          python3 -m ensurepip --upgrade
          python3 -m pip install --user scons
          scons --version

      - name: Setup cmake
        shell: bash
        run: |
          brew install cmake
          cmake --version

      - name: Remove existing binaries
        run: |
          rm -Rf bin/

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=x86_64
          platform: macos
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} arch=arm64
          platform: macos
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}

      - name: Strip binaries
        if: ${{ matrix.strip }}
        run: |
          echo "Stripping binaries"
          strip bin/*

      - name: Prepare universal executable
        run: |
          lipo -create bin/${{ matrix.bin-name-x86_64 }} bin/${{ matrix.bin-name-arm64 }} -output bin/${{ matrix.bin-name }}
          chmod -R +x bin/*

      - name: Package in macOS app bundle
        shell: sh
        run: |
          cp -R misc/dist/${{ matrix.dist-app }} bin/${{ matrix.packaged-app }}
          cd bin/
          mkdir -p ${{ matrix.packaged-app }}/Contents/MacOS
          cp ${{ matrix.bin-name }} ${{ matrix.packaged-app }}/Contents/MacOS/${{ matrix.artifact-bin-name }}
          chmod -R +x ${{ matrix.packaged-app }}
          xattr -rc ${{ matrix.packaged-app }}
          zip -q -9 -r ${{ matrix.artifact-name }}.zip ${{ matrix.packaged-app }}

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: "${{ matrix.artifact-name }}.zip"
          path: "./godot-engine/bin/${{ matrix.artifact-name }}.zip"

      - uses: 'google-github-actions/auth@v2'
        if: ${{ inputs.deploy-to-gcp }}
        with:
          credentials_json: '${{ secrets.GCP_BUCKET_UPLOAD }}'

      - name: Upload binary
        if: ${{ inputs.deploy-to-gcp }}
        uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: ./godot-engine/bin/${{ matrix.artifact-name }}.zip
          destination: ${{ matrix.bucket-name }}/${{steps.vars.outputs.sha_short}}/
  build-linux:
    if: ${{ !inputs.windows-only }}
    runs-on: ${{ inputs.self-hosted-runner && 'linux-mirror' || 'ubuntu-22.04' }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Editor
            cache-name: linux-editor
            target: editor
            sconsflags: arch=x86_64 debug_symbols=yes optimize=speed_trace use_static_cpp=yes
            strip: false
            bin: "./bin/godot.linuxbsd.editor.x86_64"
            artifact-name: "MirrorGodotEditorLinux.x86_64"
            artifact: true
            tests: no
            bucket-name: mirror_native_client_builds/Engine

          - name: Linux Template
            cache-name: linux-template
            target: template_release
            strip: true
            sconsflags: arch=x86_64 debug_symbols=no optimize=speed use_static_cpp=yes
            bin: "./bin/godot.linuxbsd.template_release.x86_64"
            artifact-name: "linux_release.x86_64"
